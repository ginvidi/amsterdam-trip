<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111F">
  <meta name="description" content="Avventura interattiva per piccoli esploratori ad Amsterdam: missioni, stelle e mappa.">
  <title>Amsterdam Explorer</title>
  <script>
    /* Tema applicato subito, prima del CSS, per evitare il lampo di colore. */
    try {
      var saved = JSON.parse(localStorage.getItem('amsterdam-explorer:v1') || '{}');
      if (saved.theme === 'light' || saved.theme === 'dark') {
        document.documentElement.setAttribute('data-theme', saved.theme);
      }
    } catch (err) { /* storage non disponibile: pazienza */ }
  </script>
</head>
<body>
  <header class="hero" id="hero"></header>

  <div class="toolbar" id="toolbar"></div>

  <main>
    <section class="map-section" id="map" aria-labelledby="map"></section>
    <section class="missions" id="missions"></section>
    <section class="itinerary" id="itinerary"></section>
    <section class="tips" id="tips"></section>
  </main>

  <footer id="footer"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
